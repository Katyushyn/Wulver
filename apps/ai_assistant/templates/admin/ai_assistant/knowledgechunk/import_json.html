{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
    <form method="post" enctype="multipart/form-data" class="module">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="submit-row">
            <input type="submit" value="{% trans 'Import' %}" class="default">
            <a href=".." class="closelink">{% trans "Cancel" %}</a>
        </div>
    </form>
{% endblock %}
