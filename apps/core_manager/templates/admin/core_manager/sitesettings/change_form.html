{% extends "admin/help/change_form.html" %}
{% load i18n %}

{% block object-tools-items %}
    {% if original %}
        <form method="post"
              class="mr-3"
              action="{% url 'admin:core_manager_sitesettings_create_demo_data' original.pk %}"
              onsubmit="return confirm('Create or update demo pages, categories, articles, and images?');">
            {% csrf_token %}
            <button type="submit"
                    class="bg-white border-base-200 hover:text-primary-600 dark:bg-base-900 dark:border-base-700 dark:hover:text-primary-500 border cursor-pointer flex font-medium gap-2 group items-center px-3 py-2 rounded-l-default shadow-xs text-sm lg:ml-auto md:mt-0 ">
                <span class="material-symbols-outlined">database</span>
                <span>{% trans "Create demo data" %}</span>
            </button>
        </form>
    {% endif %}
    {{ block.super }}

{% endblock %}
