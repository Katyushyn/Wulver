{% extends "admin/help/change_list.html" %}
{% load i18n %}

{% block object-tools-items %}
    <div class="flex flex-row items-center">
        <a href="{% url 'admin:backup_manager_backupsnapshot_restore' %}"
           class="bg-white border border-base-200 cursor-pointer flex font-medium gap-2 items-center px-3 py-2 rounded-default shadow-xs text-sm whitespace-nowrap dark:bg-base-900 dark:border-base-700 hover:text-primary-600 dark:hover:text-primary-500"
           data-admin-action="restore-backup">
            <span class="material-symbols-outlined" aria-hidden="true">settings_backup_restore</span>
            <span>{% trans "Restore backup" %}</span>
        </a>
    </div>
    <div class="flex flex-row items-center">
        <a href="{% url 'admin:backup_manager_backupsnapshot_create_full' %}"
           class="bg-white border border-base-200 cursor-pointer flex font-medium gap-2 items-center px-3 py-2 rounded-default shadow-xs text-sm whitespace-nowrap dark:bg-base-900 dark:border-base-700 hover:text-primary-600 dark:hover:text-primary-500"
           data-admin-action="create-full-backup">
            <span class="material-symbols-outlined" aria-hidden="true">backup</span>
            <span>{% trans "Create full backup" %}</span>
        </a>
    </div>
    {{ block.super }}
{% endblock %}
