{% extends "admin/help/change_form.html" %}
{% load i18n %}
{% block object-tools-items %}
    {% if original %}
        <form method="post" class="mr-3" action="{% url 'admin:comments_manager_commentsettings_reset_defaults' original.pk %}"
              onsubmit="return confirm('{% trans "Reset all comment texts and styles to their initial values?" %}');">
            {% csrf_token %}
            <button type="submit" class="bg-white border-base-200 hover:text-primary-600 dark:bg-base-900 dark:border-base-700 border cursor-pointer flex font-medium gap-2 items-center px-3 py-2 rounded-default shadow-xs text-sm">
                <span class="material-symbols-outlined">restart_alt</span><span>{% trans "Reset to defaults" %}</span>
            </button>
        </form>
    {% endif %}
    {{ block.super }}
{% endblock %}
